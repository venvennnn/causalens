# fly.toml — run `fly launch` in the repo root, then `fly deploy`.
app = "causalens-sea"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 90

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[env]
  PORT = "8000"
  CORS_ORIGINS = "*"
  BRIGHTDATA_TRANSPORT = "http"
  USE_CACHED_DEMO_ON_FAILURE = "true"
