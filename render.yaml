services:
  - type: web
    name: causalens-sea
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: BRIGHTDATA_TRANSPORT
        value: http
      - key: USE_CACHED_DEMO_ON_FAILURE
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: claude-sonnet-4-6
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
